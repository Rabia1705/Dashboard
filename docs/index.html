<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Getting Started Sample Documentation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>Documentation Site</h1>
        <p>Standard documentation repository for this sample</p>
      </div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="Search docs..." aria-label="Search documentation" />
      </div>
      <nav id="navList" class="nav-list"></nav>
    </aside>

    <main class="content">
      <header class="page-header">
        <div>
          <h2 id="pageTitle">Loading documentation…</h2>
          <p id="pageDescription"></p>
        </div>
        <a class="dashboard-button" href="dashboard.html">Open Dashboard</a>
      </header>
      <article id="pageContent" class="markdown-body"></article>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
